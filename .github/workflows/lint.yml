name: Lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup Deno environment
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Lint
        run: deno task lint
      - name: Build
        run: deno task build
