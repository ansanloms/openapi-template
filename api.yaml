openapi: 3.1.0
info:
  version: 0.0.1
  title: OpenAPI Example
  description: |
    # openapi-template

    OpenAPI Example.

    ## 開発

    - Node 24 (`.node-version`) が必要。
    - `npm ci`: 依存を入れる。
    - `npm run lint`: 型検査、oxlint と oxfmt、textlint、redocly lint を順に実行する。
    - `npm run fix`: sort と textlint、oxlint、oxfmt の各 fixer を順に実行して最後に lint する (途中で失敗しても続行)。
    - `npm run build`: `dist/` に静的サイトを出力する。
    - `npm run dev`: リポジトリ直下を `http://localhost:4000` で配信する。
    - `npm run list`: エンドポイント一覧を出力する (`-- --format json` で JSON)。
    - `npm run search -- --schema <name>`: schema を利用しているエンドポイントを出力する。

    依存は `.npmrc` により正確な版で固定する。自前の 3 パッケージ (textlint-plugin-yaml-keys、textlint-rule-preset-ansanloms、redocly-plugin-inline-examples) は GitHub のタグを git 依存で参照しており、Dependabot が更新しないため `package.json` のタグを手で書き換えて `npm install` する。
servers:
  - url: https://api.example.org
    description: Production Server
security:
  - bearerAuth: []
paths:
  /users:
    get:
      operationId: getUsers
      summary: ユーザ一覧の取得。
      tags:
        - users
      description: |
        ユーザ一覧を取得する。
      parameters:
        - in: query
          name: ids[]
          description: 絞り込みユーザ ID。
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
            example:
              - 1
              - 2
              - 3
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseGetUsers'
              examples:
                succeeded:
                  value:
                    offset: 0
                    limit: 8
                    count: 100
                    data:
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
        '500':
          description: 処理失敗時。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                processingFailed:
                  value:
                    type: https://example.org/probs/validation-error
                    title: リクエストパラメータが不正です
                    status: 400
                    detail: id は 1 以上の整数で指定してください
                    instance: /users/abc
    post:
      operationId: postUsers
      summary: 新規ユーザ登録。
      tags:
        - users
      description: |
        新規ユーザを登録する。
      requestBody:
        description: 会員情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPostUsers'
            examples:
              normal:
                value:
                  email: user@example.org
                  status: member
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEmpty'
              examples:
                succeeded:
                  value: {}
        '500':
          description: 処理失敗時。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                processingFailed:
                  value:
                    type: https://example.org/probs/validation-error
                    title: リクエストパラメータが不正です
                    status: 400
                    detail: id は 1 以上の整数で指定してください
                    instance: /users/abc
  /users/{id}:
    get:
      operationId: getUsersId
      summary: ユーザの取得。
      tags:
        - users
      description: |
        ユーザを取得する。
      parameters:
        - in: path
          name: id
          required: true
          description: ユーザ ID。
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseGetUsers'
              examples:
                succeeded:
                  value:
                    offset: 0
                    limit: 8
                    count: 100
                    data:
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
                      - id: 1
                        email: user@example.org
                        status: admin
        '500':
          description: 処理失敗時。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                processingFailed:
                  value:
                    type: https://example.org/probs/validation-error
                    title: リクエストパラメータが不正です
                    status: 400
                    detail: id は 1 以上の整数で指定してください
                    instance: /users/abc
    put:
      operationId: putUsersId
      summary: ユーザ更新。
      tags:
        - users
      description: |
        ユーザを更新する。
      parameters:
        - in: path
          name: id
          required: true
          description: ユーザ ID。
          schema:
            type: integer
            format: int64
      requestBody:
        description: 会員情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPutUsersId'
            examples:
              normal:
                value:
                  email: user@example.org
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEmpty'
              examples:
                succeeded:
                  value: {}
        '500':
          description: 処理失敗時。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                processingFailed:
                  value:
                    type: https://example.org/probs/validation-error
                    title: リクエストパラメータが不正です
                    status: 400
                    detail: id は 1 以上の整数で指定してください
                    instance: /users/abc
components:
  schemas:
    User:
      type: object
      description: |
        ユーザ。
      required:
        - id
        - email
        - status
      properties:
        id:
          type: integer
          format: int64
          description: ユーザ ID。
        email:
          type: string
          format: email
          description: メールアドレス。
          x-faker: internet.exampleEmail
        status:
          $ref: '#/components/schemas/EnumStatus'
          description: ユーザ種別。
    EnumStatus:
      type: string
      description: |
        ユーザ種別。
      enum:
        - admin
        - member
        - guest
    RequestPostUsers:
      type: object
      required:
        - email
        - status
      properties:
        email:
          type: string
          format: email
          description: メールアドレス。
          x-faker: internet.exampleEmail
        status:
          $ref: '#/components/schemas/EnumStatus'
          description: ユーザ種別。
    RequestPutUserId:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: メールアドレス。
          x-faker: internet.exampleEmail
    ResponseError:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: 問題種別を識別する URI reference。
        title:
          type: string
          description: 問題種別の人間可読な簡潔な要約。
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP ステータスコード。
        detail:
          type: string
          description: 当該インスタンス固有の問題の説明。
        instance:
          type: string
          format: uri-reference
          description: 問題発生インスタンスを識別する URI reference。
    ResponseGetUsers:
      type: object
      required:
        - offset
        - limit
        - count
        - data
      properties:
        offset:
          type: integer
          description: 取得開始位置。
        limit:
          type: integer
          description: 取得件数。
        count:
          type: integer
          description: 総件数。
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
    ResponseGetUsersId:
      $ref: '#/components/schemas/User'
    ResponseEmpty:
      type: object
    RequestPutUsersId:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: メールアドレス。
          x-faker: internet.exampleEmail
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
